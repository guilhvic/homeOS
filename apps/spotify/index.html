<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <title>Spotify Visualizer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="viz"></canvas>

  <div id="lyrics" class="lyrics hidden"></div>

  <div id="lyrics-skeleton" class="lyrics-skeleton hidden">
    <div class="skel-line skel-small"></div>
    <div class="skel-line skel-big"></div>
    <div class="skel-line skel-small skel-narrow"></div>
  </div>

  <div id="login" class="overlay">
    <h1>Spotify Visualizer</h1>
    <p>Conecte sua conta pra ver o que está tocando</p>
    <button id="login-btn">Entrar com Spotify</button>
    <p class="hint">Abra o DevTools (F12) se algo der errado.</p>
  </div>

  <div id="viz-selector" class="viz-selector hidden">
    <button id="viz-prev" aria-label="Anterior" data-tip="Visualizador anterior (←)">‹</button>
    <span id="viz-name"></span>
    <button id="viz-next" aria-label="Próximo" data-tip="Próximo visualizador (→)">›</button>
    <button id="viz-settings" aria-label="Ajustes do visualizador" data-tip="Ajustes do visualizador">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09a1.65 1.65 0 00-1-1.51 1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09a1.65 1.65 0 001.51-1 1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33h.01a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51h.01a1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82v.01a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/>
      </svg>
    </button>
  </div>

  <div id="viz-settings-panel" class="viz-settings-panel hidden"></div>

  <div id="audio-switch" class="audio-switch hidden" role="radiogroup" aria-label="Entrada de áudio">
    <button data-mode="off" class="audio-opt" data-tip="Sem áudio reativo">
      <svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor" aria-hidden="true"><path d="M16.5 12A4.5 4.5 0 0014 8.05v2.06l2.45 2.45c.03-.18.05-.37.05-.56zM19 12c0 .94-.2 1.82-.54 2.64l1.51 1.51A8.96 8.96 0 0021 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06a8.99 8.99 0 003.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
      <span>Off</span>
    </button>
    <button data-mode="mic" class="audio-opt" data-tip="Reagir ao microfone">
      <svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor" aria-hidden="true"><path d="M12 14a3 3 0 003-3V5a3 3 0 00-6 0v6a3 3 0 003 3zm5-3a5 5 0 01-10 0H5a7 7 0 006 6.92V21h2v-3.08A7 7 0 0019 11h-2z"/></svg>
      <span>Mic</span>
    </button>
    <button data-mode="system" class="audio-opt" data-tip="Reagir ao áudio do sistema">
      <svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor" aria-hidden="true"><path d="M21 3H3a2 2 0 00-2 2v12a2 2 0 002 2h7v2H8v2h8v-2h-2v-2h7a2 2 0 002-2V5a2 2 0 00-2-2zm0 14H3V5h18v12z"/></svg>
      <span>Sistema</span>
    </button>
    <span id="audio-level" class="audio-level"></span>
  </div>

  <div id="player" class="player hidden">
    <img id="cover" alt="">
    <div class="meta">
      <div id="track" class="track"></div>
      <div id="artist" class="artist"></div>
      <div id="extra" class="extra"></div>
      <div class="progress"><div id="progress-fill"></div></div>
      <div class="controls">
        <button id="ctrl-prev" class="ctrl-btn" aria-label="Anterior" data-tip="Música anterior">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M6 6h2v12H6zM9.5 12l8.5-6v12z"/></svg>
        </button>
        <button id="ctrl-play" class="ctrl-btn play-pause" aria-label="Play/Pause" data-tip="Play/Pause (Espaço)">
          <svg class="icon-play" viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          <svg class="icon-pause" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" style="display:none"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
        </button>
        <button id="ctrl-next" class="ctrl-btn" aria-label="Próxima" data-tip="Próxima música">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M16 6h2v12h-2zM6 6l8.5 6L6 18z"/></svg>
        </button>
      </div>
    </div>
  </div>

  <button id="queue-toggle" class="icon-btn queue-toggle" aria-label="Próximas músicas" data-tip="Fila (Q)" data-tip-pos="bottom">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 6h13M3 12h13M3 18h9"/>
      <path d="M17 15l4 3-4 3z" fill="currentColor" stroke="none"/>
    </svg>
  </button>

  <aside id="queue-panel" class="queue-panel hidden" aria-label="Próximas músicas">
    <div class="queue-header">
      <span class="queue-title">Próximas</span>
      <button id="queue-close" class="queue-close" aria-label="Fechar" data-tip="Fechar" data-tip-pos="bottom" data-tip-align="right">×</button>
    </div>
    <div id="queue-list" class="queue-list"></div>
  </aside>

  <button id="lyrics-toggle" class="icon-btn lyrics-toggle" aria-label="Mostrar lyrics" data-tip="Lyrics (L)" data-tip-pos="bottom">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="6" width="18" height="12" rx="2"/>
      <path d="M7 12h2M7 15h4M14 12h3M13 15h4"/>
    </svg>
  </button>

  <button id="fullscreen-btn" class="fullscreen-btn icon-btn" aria-label="Tela cheia" data-tip="Tela cheia (F)" data-tip-pos="bottom" data-tip-align="right">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path class="icon-enter" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>
      <path class="icon-exit" d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5" style="display:none"/>
    </svg>
  </button>

  <div id="status" class="status hidden"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/color-thief/2.4.0/color-thief.umd.js"></script>
  <script src="app.js"></script>
</body>
</html>
